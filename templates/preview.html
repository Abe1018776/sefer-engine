<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title or 'ספר' }} — תצוגה מקדימה</title>
<style>
  :root {
    --bg: #f0ede6;
    --card: #ffffff;
    --border: #d4c5a9;
    --accent: #5c4a2e;
    --accent-light: #8b7355;
    --text: #2c2416;
    --text-muted: #7a6b55;
    --error: #b33a3a;
    --error-bg: #fdf0f0;
    --success: #3a7a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Frank Ruhl Libre', 'David Libre', serif;
    background: var(--bg);
    color: var(--text);
    direction: rtl;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Toolbar */
  .toolbar {
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .toolbar h1 {
    font-size: 1.3rem;
    color: var(--accent);
  }
  .toolbar-info {
    font-size: 0.9rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .toolbar-info .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 0.75rem;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    font-weight: 600;
  }
  .toolbar-actions { display: flex; gap: 0.5rem; align-items: center; }
  .btn {
    display: inline-block;
    padding: 0.5rem 1.3rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent-light); }
  .btn-outline {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .btn-outline:hover {
    background: var(--accent);
    color: #fff;
  }
  .btn-success {
    background: var(--success);
  }
  .btn-success:hover {
    background: #2e6e2e;
  }

  /* Error banner */
  .error-banner {
    background: var(--error-bg);
    border: 1px solid var(--error);
    border-radius: 6px;
    padding: 1rem 1.5rem;
    margin: 1rem 1.5rem;
    color: var(--error);
    font-weight: 500;
    text-align: center;
  }

  /* Preview frame */
  .preview-container {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 1.5rem;
  }
  .preview-frame {
    width: 100%;
    max-width: 750px;
    min-height: 80vh;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  /* Responsive */
  @media (max-width: 600px) {
    .toolbar {
      padding: 0.6rem 1rem;
      gap: 0.3rem;
    }
    .toolbar h1 { font-size: 1.1rem; }
    .preview-container { padding: 0.5rem; }
    .btn { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="toolbar">
    <h1>{{ title or 'ספר' }}</h1>
    <span class="toolbar-info">
      {% if page_count %}
        <span class="badge">{{ page_count }} עמודים</span>
      {% endif %}
      {% if section_count %}
        <span class="badge">{{ section_count }} פרקים</span>
      {% endif %}
    </span>
    <div class="toolbar-actions">
      <a href="/" class="btn btn-outline">&#8592; חזרה</a>
      <a href="/download/{{ job_id }}" class="btn btn-success">&#8681; הורד PDF</a>
    </div>
  </div>

  {% if error %}
  <div class="error-banner">{{ error }}</div>
  {% endif %}

  <div class="preview-container">
    <iframe
      class="preview-frame"
      src="/preview/{{ job_id }}/content"
      frameborder="0"
      title="תצוגה מקדימה"
    ></iframe>
  </div>
</body>
</html>
